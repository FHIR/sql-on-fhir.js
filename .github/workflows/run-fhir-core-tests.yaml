name: Run FHIR Core SQL on FHIR Tests

on:
  workflow_dispatch:
    inputs:
      fhir_core_branch:
        description: "Branch of hapifhir/org.hl7.fhir.core to test"
        required: true
        default: "master"
  schedule:
    # Run weekly on Sunday at 03:17 UTC. The offbeat minute and hour avoid
    # GitHub's scheduling backlog at the top of common hours.
    - cron: "17 3 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run FHIR Core tests and build report
    steps:
      # Checkout FHIR Core
      - name: Checkout FHIR Core
        uses: actions/checkout@v4
        with:
          repository: hapifhir/org.hl7.fhir.core
          ref: ${{ github.event.inputs.fhir_core_branch || 'master' }}
          path: fhir-core

      # Install Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
          cache: maven

      # Build the r5 module of FHIR Core (and its dependencies)
      - name: Build r5 module and dependencies
        working-directory: fhir-core
        run: mvn install -pl org.hl7.fhir.r5 -am -DskipTests

      # Run the SQL on FHIR compliance tests in FHIR Core, producing
      # sof-test-report.json
      - name: Run SQL on FHIR tests
        working-directory: fhir-core
        run: mvn surefire:test@sof-compliance-test -pl org.hl7.fhir.r5

      # Checkout this repository (test report sources)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: tooling

      # Set up Bun for JavaScript dependencies
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # Set up Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # Build test report viewer site
      - name: Build test report
        working-directory: tooling/test_report
        run: |
          bun install
          bun run prepare
          bun run build

      # Assemble the test report site and drop the FHIR Core results JSON in
      # alongside it so the viewer can fetch it
      - name: Assemble extra content
        run: |
          mkdir -p extra
          cp -R tooling/test_report/public/* extra/
          cp fhir-core/org.hl7.fhir.r5/target/sof-test-report.json extra/hl7-fhir-core-test-results.json

      # Check out the releases branch and commit the fresh results JSON back to
      # it. The releases branch is the persistent source of truth, so the deploy
      # job overlays the rebuilt report onto these committed results rather than
      # the stale copy already in releases.
      - name: Checkout releases branch
        uses: actions/checkout@v4
        with:
          ref: releases
          path: releases

      - name: Commit FHIR Core results to releases
        run: |
          mkdir -p releases/extra
          cp extra/hl7-fhir-core-test-results.json releases/extra/hl7-fhir-core-test-results.json
          cd releases
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extra/hl7-fhir-core-test-results.json
          if git diff --cached --quiet; then
            echo "No change to FHIR Core results; skipping commit."
          else
            git commit -m "Update FHIR Core SQL on FHIR test results"
            git push
          fi

      # Upload the assembled extra/ content (rebuilt report plus fresh results
      # JSON) for the deploy job to overlay onto the releases branch.
      - name: Upload built extra content
        uses: actions/upload-artifact@v4
        with:
          name: extra
          path: extra

  # Deploy the combined site so the live report reflects the new results. Runs
  # whether or not the JSON changed, since the rebuilt report may differ.
  deploy:
    needs: run-tests
    uses: ./.github/workflows/deploy.yaml
    with:
      artifact-name: extra
