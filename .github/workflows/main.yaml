name: build
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    name: Validate reference implementation and build test report
    steps:
      # Check out the branch being built (the test report and playground
      # sources live here).
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Bun for JavaScript dependencies.
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # Set up Node.js.
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install dependencies for sof-js.
      - name: Install dependencies
        working-directory: sof-js
        run: bun install

      # Run code formatting checks.
      - name: Check formatting
        working-directory: sof-js
        run: bun run check-fmt

      # Validate JSON tests.
      - name: Validate JSON tests
        working-directory: sof-js
        run: bun run validate

      # Run tests.
      - name: Run tests
        working-directory: sof-js
        run: bun run test
        continue-on-error: true

      # Build test report viewer site (includes the playground).
      - name: Build test report
        working-directory: test_report
        run: |
          bun install
          bun run prepare
          bun run build

      # Upload the built test report so the deploy job can overlay it onto the
      # releases branch. Only uploaded on main, where the deploy job runs.
      - name: Upload built extra content
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: extra
          path: test_report/public

  # Deploy only on the main branch; feature-branch builds act as CI only.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yaml
    with:
      artifact-name: extra
